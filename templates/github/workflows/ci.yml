name: CI

on:
  pull_request:
  push:
    branches: [{ { RELEASE_BRANCH } }, { { INTEGRATION_BRANCH } }]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - run: mise run check
